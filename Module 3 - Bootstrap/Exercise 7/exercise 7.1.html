<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Typography</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-4">

    <h1 class="display-1">Display 1 Heading</h1>

    <p class="lead">
        This is a lead paragraph used for important introductory text.
    </p>

    <p class="text-muted">
        This text appears muted.
    </p>

    <p class="fw-bold">
        This text is bold.
    </p>

    <p class="fw-light">
        This text is light.
    </p>

    <p class="fst-italic">
        This text is italic.
    </p>

</div>

</body>
</html>
