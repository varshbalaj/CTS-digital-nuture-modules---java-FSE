<!DOCTYPE html>
<html>
<head>
    <title>Badge Overlay</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">

    <div class="position-relative d-inline-block">

        <img src="product.jpg"
             width="300"
             class="img-fluid"
             alt="Product">

        <span class="badge bg-danger
                     position-absolute
                     top-0 start-100
                     translate-middle">

            New
        </span>

    </div>

</div>

</body>
</html>
