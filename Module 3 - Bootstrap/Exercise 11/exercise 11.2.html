<!DOCTYPE html>
<html>
<head>
    <title>Media Object</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-4">

    <div class="d-flex">

        <img src="profile.jpg"
             width="100"
             height="100"
             class="me-3 rounded"
             alt="Profile">

        <div>

            <h5>John Doe</h5>

            <p>
                This content appears beside the image.
                Bootstrap Flexbox is used to create
                a media-object style layout.
            </p>

        </div>

    </div>

</div>

</body>
</html>
