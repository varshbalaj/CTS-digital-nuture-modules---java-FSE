<!DOCTYPE html>
<html>
<head>
    <title>Profile Card</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">

    <div class="card" style="width:300px;">

        <img src="profile.jpg"
             class="card-img-top"
             alt="Profile">

        <div class="card-body">

            <h5 class="card-title">
                Varshini
            </h5>

            <p class="card-text">
                Web Developer and Student
            </p>

            <a href="#"
               class="btn btn-primary">
                View Profile
            </a>

        </div>

    </div>

</div>

</body>
</html>
