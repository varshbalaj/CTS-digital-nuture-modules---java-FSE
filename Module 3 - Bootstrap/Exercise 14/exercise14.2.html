<!DOCTYPE html>
<html>
<head>
    <title>Responsive Sidebar</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
</head>
<body>

<div class="container-fluid">

    <div class="row">

        <div class="col-md-3 bg-dark text-white p-4 d-none d-md-block">
            <h4>Sidebar</h4>
            <ul>
                <li>Dashboard</li>
                <li>Profile</li>
                <li>Settings</li>
            </ul>
        </div>

        <div class="col-md-9 p-4">
            <h2>Main Content</h2>
            <p>
                Sidebar appears only on tablets and larger screens.
            </p>
        </div>

    </div>

</div>

</body>
</html>
