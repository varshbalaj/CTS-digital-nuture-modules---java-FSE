<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">

    <h2 class="mb-4">
        Dashboard
    </h2>

    <div class="row">

        <div class="col-md-3">
            <div class="bg-primary text-white p-4 rounded">
                <h4>Users</h4>
                <h2>120</h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="bg-success text-white p-4 rounded">
                <h4>Sales</h4>
                <h2>350</h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="bg-warning text-dark p-4 rounded">
                <h4>Orders</h4>
                <h2>75</h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="bg-danger text-white p-4 rounded">
                <h4>Alerts</h4>
                <h2>10</h2>
            </div>
        </div>

    </div>

</div>

</body>
</html>
